  quill-consumer-e2e:
    name: Quill consumer E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: nightly-2026-08-25

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          fast_cmaes_ref="3bf11b7601b54a08ffabb55821289ecb235a504d"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quill-consumer-e2e
          cache-targets: true

      - name: Run consumer sweep with structured logs
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="ci_artifacts/quill_consumer_e2e"
          mkdir -p "${artifact_dir}"
          results="${artifact_dir}/suite-results.jsonl"
          : >"${results}"

          run_test_suite() {
            local suite="$1"
            local fixture_ids="$2"
            shift 2
            local log="${artifact_dir}/${suite}.log"
            "$@" 2>&1 | tee "${log}"
            local summary
            summary="$(grep 'test result: ok\.' "${log}" | tail -1)"
            if [[ -z "${summary}" ]]; then
              echo "missing successful test summary for ${suite}" >&2
              return 1
            fi
            local passed failed ignored
            passed="$(sed -E 's/.* ([0-9]+) passed;.*/\1/' <<<"${summary}")"
            failed="$(sed -E 's/.* ([0-9]+) failed;.*/\1/' <<<"${summary}")"
            ignored="$(sed -E 's/.* ([0-9]+) ignored;.*/\1/' <<<"${summary}")"
            jq -cn \
              --arg suite "${suite}" \
              --arg fixtures "${fixture_ids}" \
              --arg summary "${summary}" \
              --arg log "${suite}.log" \
              --argjson passed "${passed}" \
              --argjson failed "${failed}" \
              --argjson ignored "${ignored}" \
              '{
                suite: $suite,
                fixture_ids: ($fixtures | split(",")),
                status: "pass",
                passed: $passed,
                failed: $failed,
                ignored: $ignored,
                summary: $summary,
                log: $log
              }' >>"${results}"
          }

          run_command() {
            local suite="$1"
            local fixture_ids="$2"
            shift 2
            local log="${artifact_dir}/${suite}.log"
            "$@" 2>&1 | tee "${log}"
            jq -cn \
              --arg suite "${suite}" \
              --arg fixtures "${fixture_ids}" \
              --arg log "${suite}.log" \
              '{
                suite: $suite,
                fixture_ids: ($fixtures | split(",")),
                status: "pass",
                passed: 1,
                failed: 0,
                ignored: 0,
                summary: "command completed successfully",
                log: $log
              }' >>"${results}"
          }

          run_test_suite \
            facade-quill \
            "index-builder" \
            cargo test -p frankensearch --lib --no-default-features --features quill -- --nocapture
          run_test_suite \
            facade-integration \
            "cross-component,consumer-api" \
            cargo test -p frankensearch --test integration --no-default-features --features hash,quill -- --nocapture
          run_test_suite \
            facade-docs \
            "crate-quickstart" \
            cargo test -p frankensearch --doc --no-default-features --features hash,quill -- --nocapture
          run_command \
            facade-basic-search \
            "basic-search,quill-lexical" \
            cargo run -p frankensearch --example basic_search --no-default-features --features hash,quill

          jq -s \
            --arg revision "${GITHUB_SHA}" \
            '{
              schema: "quill-consumer-e2e-sweep-v1",
              revision: $revision,
              lexical_engine: "quill",
              status: (if all(.status == "pass") then "pass" else "fail" end),
              suite_count: length,
              total_passed: (map(.passed) | add),
              total_failed: (map(.failed) | add),
              total_ignored: (map(.ignored) | add),
              suites: .
            }' "${results}" >"${artifact_dir}/manifest.json"
          jq -e \
            '.status == "pass" and .suite_count == 4 and .total_failed == 0' \
            "${artifact_dir}/manifest.json" >/dev/null

      - name: Upload consumer sweep artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quill-consumer-e2e-${{ github.run_id }}
          path: ci_artifacts/quill_consumer_e2e/*
          retention-days: 30

  publish-crates:
    name: Publish crates.io packages
    if: startsWith(github.ref, 'refs/tags/crates-v') && vars.ENABLE_CRATES_PUBLISH == 'true' && github.repository_owner == 'Dicklesworthstone'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-05
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt, clippy

      - name: Prepare path dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          fast_cmaes_ref="3bf11b7601b54a08ffabb55821289ecb235a504d"

          clone_or_update() {
            local repo_url="$1"
            local dest_path="$2"
            local ref="$3"
            if [[ -d "${dest_path}/.git" ]]; then
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            else
              git clone --no-checkout "${repo_url}" "${dest_path}"
              git -C "${dest_path}" fetch --depth 1 origin "${ref}"
            fi
            git -C "${dest_path}" checkout --detach FETCH_HEAD
          }

          clone_or_update "https://github.com/Dicklesworthstone/fast_cmaes.git" "${deps_dir}/fast_cmaes" "${fast_cmaes_ref}"

          find "$GITHUB_WORKSPACE" -name Cargo.toml -exec \
            sed -i.bak -e "s|/data/projects/|${deps_dir}/|g" {} +
          find "$GITHUB_WORKSPACE" -name '*.bak' -delete

      - name: Resolve and authenticate publication plan
        id: publish_plan
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          plan_path="${RUNNER_TEMP}/frankensearch-crates-publish-plan.json"
          scripts/check_crates_publish_contract.sh \
            --mode gate \
            --scope workspace \
            --registry-census live \
            --release-tag "${TAG_NAME}" \
            --output "${plan_path}"

          sequence="$(jq -r '[.packages[] | select(.action == "publish") | .name] | join(" ")' "${plan_path}")"
          exact_existing="$(jq -r '[.packages[] | select(.action == "skip_exact_archive") | .name] | join(" ")' "${plan_path}")"
          echo "Publication sequence: ${sequence:-<nothing-new>}"
          echo "Exact-source versions already present: ${exact_existing:-<none>}"
          echo "sequence=${sequence}" >> "${GITHUB_OUTPUT}"
          echo "plan_path=${plan_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload authenticated publication-plan receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates-publish-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frankensearch-crates-publish-plan.json
          if-no-files-found: error

      - name: Publish crates in dependency order
        if: steps.publish_plan.outputs.sequence != ''
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PLAN_PATH: ${{ steps.publish_plan.outputs.plan_path }}
          PUBLISH_SEQUENCE: ${{ steps.publish_plan.outputs.sequence }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is required when ENABLE_CRATES_PUBLISH=true" >&2
            exit 1
          fi

          for crate in ${PUBLISH_SEQUENCE}; do
            crate_version="$(
              jq -r --arg crate "${crate}" \
                '.packages[] | select(.name == $crate) | .version' \
                "${PLAN_PATH}"
            )"
            for attempt in 1 2 3 4 5; do
              set +e
              dry_run_output="$(cargo publish -p "${crate}" --locked --dry-run 2>&1)"
              dry_run_status=$?
              set -e
              echo "${dry_run_output}"
              if [[ "${dry_run_status}" -eq 0 ]]; then
                break
              fi
              if [[ "${attempt}" -eq 5 ]]; then
                echo "Dry-run publish checks failed for ${crate} after ${attempt} attempts." >&2
                exit 1
              fi
              sleep 20
            done
            echo "Publishing ${crate} ${crate_version}"
            cargo publish \
              -p "${crate}" \
              --locked \
              --token "${CARGO_REGISTRY_TOKEN}"
            sleep 30
          done
