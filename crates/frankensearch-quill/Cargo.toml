[package]
name = "frankensearch-quill"
version = "0.4.1"
description = "Quill native lexical search engine for frankensearch"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
# All retained Criterion benches are declared explicitly below. The bd-l5x3
# admission probe is a normal binary so unrelated dev dependencies are not
# linked before it can emit its executable hash and A/A control.
autobenches = false

[features]
default = []
# Optional FSLX/MANIFEST repair sidecars. Tantivy integration remains outside
# Quill's dependency graph even when durability is enabled.
durability = ["dep:frankensearch-durability"]
# Same-binary A/B helpers are available only to explicit benchmark builds.
bench-internals = ["frankensearch-core/bench-internals"]
# Deterministic fault-injection seams used only by method-bound conformance
# witnesses. Shipping consumers never enable this feature.
conformance-internals = []
# Invocation-local diagnostic profile receipts. This remains separate from
# benchmark and conformance features so timing builds cannot accidentally link
# profile instrumentation.
profile-internals = []
# Exact per-refill receipts for the UNION_HORIZON oracle campaign. Kept
# separate so the same-binary performance harness never pays for tracing state.
pruning-conformance = ["conformance-internals"]
# Tantivy differential tests are valuable oracle coverage, but they must remain
# opt-in: a crate-wide dev-dependency made every Quill test and bench compile
# the full lexical/Tantivy graph and repeatedly missed the admission window.
tantivy-oracle = [
    "dep:frankensearch-lexical",
    "frankensearch-lexical/tantivy-oracle",
]

[dependencies]
# CASS fork note (cass-prefix-expansion): these four family dependencies are
# declared against crates.io, NOT against the workspace path entries, so a
# consumer that pins THIS crate alone through a git patch
# (`[patch.crates-io] frankensearch-quill = { git = ... }`) resolves every
# other family member from its published registry version and the lockfile
# keeps exactly one resolution per package. The requirements below are the
# published frankensearch-quill 0.4.1 manifest's requirements verbatim
# (registry normalization of the same deps), so the resolved set is the one
# the published crate already builds against: core 0.4.0, durability 0.4.0,
# index 0.4.0 (the 0.4.2 hotfix line), lexical 0.4.0. Keeping the workspace
# path entries here would make the git-sourced crate pull sibling copies of
# core/index/lexical/durability from this repository's tree at the pinned
# rev, duplicating every family package in the consumer's Cargo.lock.
frankensearch-core = "0.4.0"
frankensearch-index = "0.4.0"
frankensearch-durability = { version = "0.4.0", optional = true, default-features = false }
frankensearch-lexical = { version = "0.4.0", optional = true, features = ["bench-internals"] }
asupersync = { workspace = true }
arc-swap = { workspace = true }
wide = { workspace = true }
bytemuck = { workspace = true }
rayon = { workspace = true }
compact_str = { workspace = true }
ahash = { workspace = true }
crc32fast = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
# Stored metadata stays opaque until result materialization. Durable formats
# never use serde or serde_json.
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# `File::try_lock` supplies the OS-backed LockFileEx admission primitive. These
# dependencies bind the retained handles to stable Windows file identities and
# make MANIFEST replacement write-through without introducing unsafe code here.
atomicwrites = "0.4.4"
same-file = "1.0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Deterministic LabRuntime helpers remain test-only.
asupersync = { workspace = true, features = ["test-internals"] }
criterion = { workspace = true }
tempfile = "3.27"
# Parses the workspace manifest in tests/asupersync_floor.rs (gh#44).
toml = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "postings_decode_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "term_dictionary_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "id_map_materialize_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "concat_merge_ab"
harness = false

[[bench]]
name = "compaction_ab"
harness = false
required-features = ["bench-internals"]

[[bin]]
name = "tokenizer_simd_ab"
path = "benches/tokenizer_simd_ab.rs"
test = false
bench = false
required-features = ["bench-internals"]

[[bench]]
name = "scribe_flush_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "parallel_shard_ingest_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "segment_fanout_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "collector_packed_key_ab"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "grouped_maxscore_ab"
harness = false
required-features = ["bench-internals"]

[lints]
workspace = true
